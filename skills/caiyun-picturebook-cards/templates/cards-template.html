<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>消费降级 × 毛选省钱兵法 · 14页图文卡</title>
<link rel="preconnect" href="https://fonts.loli.net">
<link href="https://fonts.loli.net/css2?family=ZCOOL+KuaiLe&family=Ma+Shan+Zheng&display=swap" rel="stylesheet">
<style>
/* === 彩铅绘本图文卡 · 设计系统（caiyun-picturebook-cards）=== */
:root{
  --paper:  #F7F2E7;
  --ink:    #3A3532;
  --marker: rgba(255,213,79,.9);
  --red:    #D9534F;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:#E8E2D5;font-family:'ZCOOL KuaiLe','Ma Shan Zheng','KaiTi','STKaiti',cursive;-webkit-font-smoothing:antialiased}
.deck{display:flex;flex-direction:column;align-items:center;gap:40px;padding:40px 0}

.card{
  width:1080px;height:1440px;
  position:relative;overflow:hidden;
  background:var(--paper);
  color:var(--ink);
  display:flex;flex-direction:column;
}

.headline{
  padding:56px 72px 0;
  text-align:center;
  font-size:64px;
  line-height:1.55;
  letter-spacing:2px;
  z-index:2;
}
.headline.cover{font-size:66px}
.headline .hl{
  background:linear-gradient(to top, var(--marker) 0 24%, transparent 24%);
  padding:0 4px;
}
.headline .red{color:var(--red)}

.artwrap{
  flex:1;min-height:0;width:100%;
  position:relative;
}
.art{
  width:100%;height:100%;
  object-fit:cover;object-position:center;
  display:block;
  -webkit-mask-image:linear-gradient(to bottom, transparent 0, #000 12%);
  mask-image:linear-gradient(to bottom, transparent 0, #000 12%);
}

.tag{
  position:absolute;z-index:2;
  background:#E85D4A;color:#fff;
  font-size:38px;letter-spacing:3px;
  padding:10px 26px;border-radius:18px;
  border:3px solid rgba(255,255,255,.9);
  box-shadow:0 4px 0 rgba(58,53,50,.15);
}
.tag::after{
  content:'';position:absolute;left:26px;bottom:-14px;
  border:10px solid transparent;border-top-color:#E85D4A;border-bottom:0;
}
.tag.tl{transform:rotate(-5deg)}
.tag.tr{transform:rotate(4deg)}
</style>
</head>
<body>
<div class="deck">

<!-- ============ 第 1 页 · 封面 ============ -->
<section class="card" id="card-1">
  <div class="headline cover">
    消费降级的时代，<br>
    普通人该怎么花钱？<br>
    毛选给出的答案是：<span class="hl">以退为进</span>
  </div>
  <div class="artwrap">
    <img class="art" src="assets/page-01.jpg">
  </div>
</section>

<!-- ============ 第 2 页 · 痛点 ============ -->
<section class="card" id="card-2">
  <div class="headline">
    工资没涨，物价在涨，<br>
    连奶茶都要<span class="hl">犹豫再三</span>
  </div>
  <div class="artwrap">
    <img class="art" src="assets/page-02.jpg">
  </div>
</section>

<!-- ============ 第 3 页 · 痛点 ============ -->
<section class="card" id="card-3">
  <div class="headline">
    去年双十一囤的纸巾，<br>
    到今年<span class="hl">还没拆封</span>
  </div>
  <div class="artwrap">
    <img class="art" src="assets/page-03.jpg">
  </div>
</section>

<!-- ============ 第 4 页 · 误区转折 ============ -->
<section class="card" id="card-4">
  <div class="headline">
    于是有人一分钱都不花，<br>
    可教员说：<span class="red">这也不对</span>
  </div>
  <div class="artwrap">
    <img class="art" src="assets/page-04.jpg">
  </div>
</section>

<!-- ============ 第 5 页 · 权威金句 ============ -->
<section class="card" id="card-5">
  <div class="headline">
    没有调查，就没有发言权。<br>
    先记账一个月：<span class="hl">钱都去哪了</span>
  </div>
  <div class="artwrap">
    <img class="art" src="assets/page-05.jpg">
  </div>
</section>

<!-- ============ 第 6 页 · 概念迁移 ============ -->
<section class="card" id="card-6">
  <div class="headline">
    消费降的是面子，<br>
    不是<span class="hl">日子</span>
  </div>
  <div class="artwrap">
    <img class="art" src="assets/page-06.jpg">
  </div>
</section>

<!-- ============ 第 7 页 · 章节一 ============ -->
<section class="card" id="card-7">
  <div class="headline cover">
    一、抓主要矛盾，<span class="hl">钱花在刀刃上</span>
  </div>
  <div class="artwrap">
    <img class="art" src="assets/page-07.jpg">
  </div>
</section>

<!-- ============ 第 8 页 · 方法一 ============ -->
<section class="card" id="card-8">
  <div class="headline">
    健康和学习别省，<br>
    面子和包装<span class="hl">统统让路</span>
  </div>
  <div class="artwrap">
    <img class="art" src="assets/page-08.jpg">
  </div>
</section>

<!-- ============ 第 9 页 · 方法一 ============ -->
<section class="card" id="card-9">
  <div class="headline">
    十件便宜货，<br>
    不如<span class="hl">一件真正的好东西</span>
  </div>
  <div class="artwrap">
    <img class="art" src="assets/page-09.jpg">
  </div>
</section>

<!-- ============ 第 10 页 · 章节二 ============ -->
<section class="card" id="card-10">
  <div class="headline cover">
    二、自己动手，丰衣足食
  </div>
  <div class="artwrap">
    <img class="art" src="assets/page-10.jpg">
  </div>
</section>

<!-- ============ 第 11 页 · 方法二 ============ -->
<section class="card" id="card-11">
  <div class="headline">
    一顿自己做的饭，<br>
    胜过<span class="hl">十份外卖</span>
  </div>
  <div class="artwrap">
    <img class="art" src="assets/page-11.jpg">
  </div>
</section>

<!-- ============ 第 12 页 · 章节三 ============ -->
<section class="card" id="card-12">
  <div class="headline">
    三、攒钱是持久战，<br>
    不打无准备之仗
  </div>
  <div class="artwrap">
    <img class="art" src="assets/page-12.jpg">
  </div>
</section>

<!-- ============ 第 13 页 · 方法三 ============ -->
<section class="card" id="card-13">
  <div class="headline">
    工资到账先存一笔：<br>
    存款就是你的<span class="hl">根据地</span>
  </div>
  <div class="artwrap">
    <img class="art" src="assets/page-13.jpg">
  </div>
</section>

<!-- ============ 第 14 页 · 收尾金句 ============ -->
<section class="card" id="card-14">
  <div class="headline">
    <span class="hl">消费可以降级</span>，<br>
    <span class="hl">生活从来不降格</span>
  </div>
  <div class="artwrap">
    <img class="art" src="assets/page-14.jpg">
  </div>
</section>

</div>
</body>
</html>
